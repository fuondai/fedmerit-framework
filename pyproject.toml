[build-system]
requires = ["setuptools==81.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fedmerit-framework"
version = "0.1.0"
description = "FedMERIT reference implementation of state-scoped commit certificates"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10,<3.15"
dependencies = [
    "cffi==2.0.0",
    "cryptography==46.0.7",
    "pycparser==3.0",
    "typing-extensions==4.15.0; python_version < '3.11'",
]

[project.scripts]
fedmerit = "fedmerit.cli:main"

[tool.setuptools]
packages = ["fedmerit"]

[tool.ruff]
target-version = "py310"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
